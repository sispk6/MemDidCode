# config_standalone.yaml
# Configuration for Standalone Web Mode (Local Desktop)

gmail:
  credentials_file: "credentials.json"
  token_file: "token.json"
  max_results: 100

# Optional: Multiple Gmail accounts support
# gmail_accounts:
#   - name: "Personal"
#     token_file: "token_personal.json"
#     max_results: 100
#   - name: "Work"
#     token_file: "token_work.json"
#     max_results: 50

embeddings:
  model_name: "BAAI/bge-base-en-v1.5"
  dimension: 768
  reranker_model_name: "BAAI/bge-reranker-base"

llm:
  provider: "huggingface"
  model_name: "meta-llama/Meta-Llama-3-8B-Instruct"
  api_key_env_var: "HUGGINGFACE_API_KEY"

storage:
  chromadb_path: "./data/chromadb"
  collection_name: "didi_messages"

paths:
  raw_data: "./data/raw"
  users_base_dir: "./data/users"

chunking:
  chunk_size: 2000
  overlap: 200

# MCP Configuration
mcp:
  enabled: true
  default_mode: "mcp"  # Options: "legacy" or "mcp"
  gmail:
    use_mcp: true  # Set to true to use MCP by default

# User Configuration (for metadata enhancements)
user:
  email: "you@example.com"  # Replace with your email for direction detection
  name: "Your Name"         # Replace with your name
